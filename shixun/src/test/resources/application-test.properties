# Keep tests self-contained: production credentials and JWT keys are deliberately
# not present in application.properties.
spring.datasource.url=jdbc:h2:mem:shixun_test;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:test-schema.sql
spring.sql.init.continue-on-error=false
spring.main.lazy-initialization=true

auth.jwt.secret=test-only-jwt-secret-that-is-long-enough-2026
auth.jwt.expires-seconds=900

mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
logging.level.com.example.shixun.mapper=debug
logging.level.org.mybatis=debug
