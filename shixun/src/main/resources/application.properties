spring.config.import=optional:file:./application-local.properties
spring.application.name=and-taste
server.address=0.0.0.0
server.port=8080

# Browser clients may call the API only from these origins. Keep the default
# local-only list for development and set CORS_ALLOWED_ORIGINS in production.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5176,http://127.0.0.1:5176,http://localhost:5173,http://127.0.0.1:5173}

# Database credentials are deployment secrets. Configure DB_URL, DB_USERNAME and
# DB_PASSWORD (or override them in the ignored application-local.properties).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# Schema/sample imports must never run automatically in production. Use a
# versioned migration or explicitly opt in with SQL_INIT_MODE for local demos.
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.sql.init.schema-locations=classpath:schema.sql,classpath:and_taste_schema.sql,classpath:sample_work_order_import.sql,classpath:bulk_production_order_import.sql,classpath:product_inventory_import.sql
spring.sql.init.continue-on-error=${SQL_INIT_CONTINUE_ON_ERROR:false}

# JWT signing material must be injected by the deployment environment. The
# application fails fast if this value is empty or too short.
auth.jwt.secret=${AUTH_JWT_SECRET:}
auth.jwt.expires-seconds=${AUTH_JWT_EXPIRES_SECONDS:28800}

# Manual QR is disabled automatically when this resource is missing. For a
# production deployment use an HTTPS, business-owned payment URL or replace
# the bundled image through the deployment artifact; never commit a personal
# account QR code to source control.
payment.manual-qr-url=${PAYMENT_MANUAL_QR_URL:/payment-collection-qr.jpg}

# 微信支付 API v3。默认关闭；只有商户请求签名、平台证书验签、支付通知和
# 退款通知均已配置时，Native/小程序支付入口才会向用户开放。所有真实值只应
# 通过环境变量或受限的 application-local.properties 注入，绝不能提交仓库。
payment.wechat.enabled=${PAYMENT_WECHAT_ENABLED:false}
payment.wechat.app-id=${PAYMENT_WECHAT_APP_ID:}
payment.wechat.mini-app-secret=${PAYMENT_WECHAT_MINI_APP_SECRET:}
payment.wechat.mch-id=${PAYMENT_WECHAT_MCH_ID:}
payment.wechat.serial-no=${PAYMENT_WECHAT_SERIAL_NO:}
payment.wechat.private-key-path=${PAYMENT_WECHAT_PRIVATE_KEY_PATH:}
payment.wechat.api-v3-key=${PAYMENT_WECHAT_API_V3_KEY:}
payment.wechat.notify-url=${PAYMENT_WECHAT_NOTIFY_URL:}
payment.wechat.refund-notify-url=${PAYMENT_WECHAT_REFUND_NOTIFY_URL:}
payment.wechat.platform-public-key-path=${PAYMENT_WECHAT_PLATFORM_PUBLIC_KEY_PATH:}
payment.wechat.platform-serial-no=${PAYMENT_WECHAT_PLATFORM_SERIAL_NO:}
# 验签时间窗口限制为 30-900 秒，避免旧通知被重放；建议保持默认 300。
payment.wechat.callback-max-age-seconds=${PAYMENT_WECHAT_CALLBACK_MAX_AGE_SECONDS:300}
payment.wechat.reconcile-enabled=${PAYMENT_WECHAT_RECONCILE_ENABLED:true}
payment.wechat.reconcile-delay-ms=${PAYMENT_WECHAT_RECONCILE_DELAY_MS:300000}
payment.wechat.reconcile-initial-delay-ms=${PAYMENT_WECHAT_RECONCILE_INITIAL_DELAY_MS:45000}
payment.wechat.reconcile-limit=${PAYMENT_WECHAT_RECONCILE_LIMIT:40}
# 微信昨日账单通常在北京时间 10:00 后生成；留出缓冲并在失败时由人工/下一次任务重试。
payment.wechat.daily-reconcile-cron=${PAYMENT_WECHAT_DAILY_RECONCILE_CRON:0 30 10 * * *}
payment.wechat.daily-reconcile-retry-cron=${PAYMENT_WECHAT_DAILY_RECONCILE_RETRY_CRON:0 30 14 * * *}

# User uploads and generated creative assets are private. Keep this location
# outside any Vite/Nginx static root; reads are served only by authenticated
# /api/creative/ai/assets/{id}/... endpoints. Defaults to ./data/creative-assets.
creative.asset.private-root=${CREATIVE_ASSET_PRIVATE_ROOT:}

# Disabled by default. Set all BOOTSTRAP_ADMIN_* values only for the one-time
# first administrator provisioning, then turn this flag off again.
app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.phone=${BOOTSTRAP_ADMIN_PHONE:}
app.bootstrap.admin.age=${BOOTSTRAP_ADMIN_AGE:30}

# 通义千问 API Key（请替换为你自己的 Key，从阿里云百炼平台获取）
qwen.api.key=${QWEN_API_KEY:}
siliconflow.image.edit.model=Qwen/Qwen-Image-Edit-2509

# 真实物流API：快递100
# 正式使用时请放到 shixun/application-local.properties，不要提交到代码仓库
kuaidi100.customer=
kuaidi100.key=
# 订阅推送需要公网可访问URL，例如 https://你的域名/api/logistics/callback/kuaidi100
kuaidi100.callback-url=
# 可选：回调签名盐值，配置后会校验快递100回调 sign
kuaidi100.salt=

# AI streaming response timeout
spring.mvc.async.request-timeout=180000

# 3D 材质版本导出会携带模型与 PBR 贴图，默认 10MB 无法保存。
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB


# Replicate / Google Imagen 4（令牌请放到 shixun/application-local.properties，不要提交仓库）
replicate.api.key=${REPLICATE_API_KEY:}
replicate.api.base-url=https://api.replicate.com/v1
replicate.imagen.model=google/imagen-4

# 墨刀 AI 设计工作区（令牌请放到 shixun/application-local.properties，不要提交仓库）
modao.api.key=${MODAO_API_KEY:}
modao.design.url=https://modao.cc/ai/design/spmrsxjgcyi6g0h1/6a5dd48151e5a21110c1697a
modao.mcp.url=https://modao.cc/agent-py/ai/mcp
modao.chrome.path=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome

# 火山引擎 Ark / Doubao Seedream 多视图（密钥由 VOLCENGINE_ARK_API_KEY 或本地密钥库注入）
volcengine.ark.api.key=${VOLCENGINE_ARK_API_KEY:}
volcengine.ark.images.base-url=https://ark.cn-beijing.volces.com/api/v3/images/generations
# 如控制台开通的是 lite 接入点，在服务器环境变量 VOLCENGINE_ARK_SEEDREAM_MULTIVIEW_MODEL 中填写对应模型/接入点名称。
volcengine.ark.seedream.multiview.model=${VOLCENGINE_ARK_SEEDREAM_MULTIVIEW_MODEL:doubao-seedream-5-0-260128}
